<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gans.studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Quicksand", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* Fade for the whole logo + text */
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .container.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      width: min(55vw, 420px);
      height: auto;
      display: block;
      cursor: pointer;

      transform: scale(1);
      transition: transform 0.18s ease-out;

      -webkit-tap-highlight-color: transparent;
    }

    /* Logo grows when mouse is over it */
    .logo:hover {
      transform: scale(1.05);
    }

    /* Small shrink after mouse leaves */
    .logo.mouse-out {
      animation: logo-pop-back 0.35s ease-out;
    }

    @keyframes logo-pop-back {
      0% {
        transform: scale(1.05);
      }

      45% {
        transform: scale(0.97);
      }

      100% {
        transform: scale(1);
      }
    }

    .name {
      margin-top: 28px;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: white;
    }

    .dot {
      color: #BC4034;
    }
  </style>
</head>

<body>

  <main class="container" id="sign">

    <img
      src="logo.png"
      alt="GANS logo"
      class="logo"
      id="logo"
    >

    <div class="name">
      gans<span class="dot">.</span>studio
    </div>

  </main>

  <script>
    const sign = document.getElementById("sign");
    const logo = document.getElementById("logo");

    /*
      CLICK:
      Fade logo + text out.
      After 5 seconds, fade them back in.
    */
    logo.addEventListener("click", function () {
      sign.classList.add("hidden");

      setTimeout(function () {
        sign.classList.remove("hidden");
      }, 5000);
    });


    /*
      MOUSE OUT:
      Logo goes slightly smaller than normal,
      then pops back to its original size.
    */
    logo.addEventListener("mouseleave", function () {
      logo.classList.remove("mouse-out");

      // Restart animation
      void logo.offsetWidth;

      logo.classList.add("mouse-out");

      setTimeout(function () {
        logo.classList.remove("mouse-out");
      }, 350);
    });
  </script>

</body>
</html>
