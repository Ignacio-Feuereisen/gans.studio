<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gans.studio</title>

  <!-- Browser tab icon / favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: #111111;
      font-family: "Quicksand", sans-serif;
    }

    /*
      The sign contains both the logo and text.

      It begins exactly in the center of the screen.
      JavaScript changes its position after each click.
    */

    .container {
      position: fixed;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      opacity: 1;
    }

    .logo {
      width: min(55vw, 420px);
      height: auto;
      display: block;

      cursor: pointer;

      transform: scale(1);
      transition: transform 0.18s ease-out;

      -webkit-tap-highlight-color: transparent;
    }


    /*
      HOVER

      Logo grows from 100% to 103%.
    */

    .logo:hover {
      transform: scale(1.03);
    }


    /*
      MOUSE LEAVE

      Logo briefly shrinks to 98%,
      then returns to 100%.
    */

    .logo.mouse-out {
      animation: logo-pop-back 0.35s ease-out;
    }

    @keyframes logo-pop-back {

      0% {
        transform: scale(1.03);
      }

      45% {
        transform: scale(0.98);
      }

      100% {
        transform: scale(1);
      }
    }


    /*
      TEXT
    */

    .name {
      margin-top: 28px;

      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: 0.08em;

      color: white;
      white-space: nowrap;
    }

    .dot {
      color: #BC4034;
    }


    /*
      FADE OUT + FLICKER

      Total: 3 seconds.

      The first part fades gradually.
      During approximately the final second,
      the sign begins flickering before dying out.
    */

    .container.fade-out {
      pointer-events: none;

      animation:
        fade-out-flicker 3s linear forwards;
    }

    @keyframes fade-out-flicker {

      0% {
        opacity: 1;
      }

      20% {
        opacity: 0.90;
      }

      40% {
        opacity: 0.78;
      }

      60% {
        opacity: 0.62;
      }


      /* Flickering begins */

      68% {
        opacity: 0.52;
      }

      71% {
        opacity: 0.22;
      }

      74% {
        opacity: 0.48;
      }

      77% {
        opacity: 0.18;
      }

      80% {
        opacity: 0.40;
      }

      84% {
        opacity: 0.12;
      }

      87% {
        opacity: 0.32;
      }

      90% {
        opacity: 0.08;
      }

      93% {
        opacity: 0.22;
      }

      96% {
        opacity: 0.04;
      }

      98% {
        opacity: 0.12;
      }

      100% {
        opacity: 0;
      }
    }


    /*
      FADE IN

      The sign fades back into its NEW
      random location over 1 second.
    */

    .container.fade-in {
      pointer-events: none;

      animation: fade-in 1s ease forwards;
    }

    @keyframes fade-in {

      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

  </style>
</head>


<body>

  <main class="container" id="sign">

    <img
      src="logo.png"
      alt="GANS logo"
      class="logo"
      id="logo"
    >

    <div class="name">
      gans<span class="dot">.</span>studio
    </div>

  </main>


  <script>

    const sign = document.getElementById("sign");
    const logo = document.getElementById("logo");

    let animationRunning = false;


    /*
      RANDOM POSITION FUNCTION

      Finds a random position while making sure
      the ENTIRE logo + text remains visible.

      A 20px safety margin is maintained around
      the edges of the browser window.
    */

    function moveToRandomPosition() {

      const margin = 20;

      /*
        Temporarily remove translate(-50%, -50%)
        because from this point onward we position
        the sign using its top-left corner.
      */

      sign.style.transform = "none";


      /*
        Measure the complete sign:
        logo + text.
      */

      const signWidth = sign.offsetWidth;
      const signHeight = sign.offsetHeight;


      /*
        Calculate how much usable screen space exists.
      */

      const maxX =
        Math.max(margin, window.innerWidth - signWidth - margin);

      const maxY =
        Math.max(margin, window.innerHeight - signHeight - margin);


      /*
        Choose random coordinates inside the
        safe area of the screen.
      */

      const randomX =
        margin + Math.random() * Math.max(0, maxX - margin);

      const randomY =
        margin + Math.random() * Math.max(0, maxY - margin);


      /*
        Move the whole sign.
      */

      sign.style.left = randomX + "px";
      sign.style.top = randomY + "px";
    }



    /*
      CLICK SEQUENCE


      0–3 SECONDS

      Logo + text gradually fade away.

      During the final part they flicker.


      3–6 SECONDS

      Completely black / invisible.


      AT 6 SECONDS

      While invisible, the logo + text
      move to a new random location.


      6–7 SECONDS

      Logo + text fade into the new position.
    */

    logo.addEventListener("click", function () {

      if (animationRunning) return;

      animationRunning = true;


      /*
        Start fade-out.
      */

      sign.classList.add("fade-out");


      /*
        After 3 seconds the sign has
        completely disappeared.
      */

      setTimeout(function () {

        sign.classList.remove("fade-out");

        sign.style.opacity = "0";

      }, 3000);


      /*
        After 6 seconds:

        The sign has now been completely
        invisible for 3 seconds.

        Move it while invisible, then
        begin fading it back in.
      */

      setTimeout(function () {

        moveToRandomPosition();

        sign.classList.add("fade-in");

      }, 6000);


      /*
        After 7 seconds:

        Fade-in is finished.
        Restore normal interactive state.
      */

      setTimeout(function () {

        sign.classList.remove("fade-in");

        sign.style.opacity = "1";

        animationRunning = false;

      }, 7000);

    });



    /*
      MOUSE LEAVE EFFECT

      Hover:
          100% → 103%

      Mouse leaves:
          103% → 98% → 100%
    */

    logo.addEventListener("mouseleave", function () {

      if (animationRunning) return;

      logo.classList.remove("mouse-out");


      /*
        Force browser to restart animation.
      */

      void logo.offsetWidth;


      logo.classList.add("mouse-out");


      setTimeout(function () {

        logo.classList.remove("mouse-out");

      }, 350);

    });

  </script>

</body>
</html>
