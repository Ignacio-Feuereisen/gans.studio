<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gans.studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Quicksand", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .logo {
      width: min(55vw, 420px);
      height: auto;
      display: block;
    }

    .name {
      margin-top: 28px;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: white;
    }

    .dot {
      color: #BC4034;
    }

    /* Fluorescent tube flicker */

    .flicker {
      animation: fluorescent-flicker 1.8s linear;
    }

    @keyframes fluorescent-flicker {

      0% {
        opacity: 1;
      }

      4% {
        opacity: 0.15;
      }

      7% {
        opacity: 0.85;
      }

      10% {
        opacity: 0.05;
      }

      14% {
        opacity: 1;
      }

      20% {
        opacity: 0.3;
      }

      23% {
        opacity: 1;
      }

      31% {
        opacity: 0.1;
      }

      34% {
        opacity: 0.75;
      }

      38% {
        opacity: 0.05;
      }

      42% {
        opacity: 1;
      }

      55% {
        opacity: 1;
      }

      58% {
        opacity: 0.2;
      }

      61% {
        opacity: 1;
      }

      64% {
        opacity: 0.45;
      }

      67% {
        opacity: 1;
      }

      100% {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

  <main class="container" id="sign">

    <img
      src="logo.png"
      alt="GANS logo"
      class="logo"
    >

    <div class="name">
      gans<span class="dot">.</span>studio
    </div>

  </main>

  <script>
    const sign = document.getElementById("sign");

    sign.addEventListener("click", function () {

      // Remove animation if it was previously triggered
      sign.classList.remove("flicker");

      // Force browser to reset the animation
      void sign.offsetWidth;

      // Start flickering
      sign.classList.add("flicker");

      // Clean up after animation finishes
      setTimeout(function () {
        sign.classList.remove("flicker");
      }, 1800);

    });
  </script>

</body>
</html>
