<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>gans.studio</title>

  <!-- Browser tab icon / favicon -->
  <link rel="icon" type="image/png" href="logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #111111;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Quicksand", sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 1;
    }

    .logo {
      width: min(55vw, 420px);
      height: auto;
      display: block;
      cursor: pointer;

      transform: scale(1);
      transition: transform 0.18s ease-out;

      -webkit-tap-highlight-color: transparent;
    }

    /* Grow to 103% when hovering */
    .logo:hover {
      transform: scale(1.03);
    }

    /* On mouse exit: shrink to 98%, then return to 100% */
    .logo.mouse-out {
      animation: logo-pop-back 0.35s ease-out;
    }

    @keyframes logo-pop-back {
      0% {
        transform: scale(1.03);
      }

      45% {
        transform: scale(0.98);
      }

      100% {
        transform: scale(1);
      }
    }

    .name {
      margin-top: 28px;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 500;
      letter-spacing: 0.08em;
      color: white;
    }

    .dot {
      color: #BC4034;
    }


    /*
      FADE-OUT + FLICKER

      Total duration: 3 seconds.

      First ~2 seconds:
      Smooth gradual fading.

      Last ~1 second:
      Increasing flickering until darkness.
    */

    .container.fade-out {
      pointer-events: none;
      animation: fade-out-flicker 3s linear forwards;
    }

    @keyframes fade-out-flicker {

      0% {
        opacity: 1;
      }

      20% {
        opacity: 0.90;
      }

      40% {
        opacity: 0.78;
      }

      60% {
        opacity: 0.62;
      }

      /* Flickering begins */

      68% {
        opacity: 0.52;
      }

      71% {
        opacity: 0.22;
      }

      74% {
        opacity: 0.48;
      }

      77% {
        opacity: 0.18;
      }

      80% {
        opacity: 0.40;
      }

      84% {
        opacity: 0.12;
      }

      87% {
        opacity: 0.32;
      }

      90% {
        opacity: 0.08;
      }

      93% {
        opacity: 0.22;
      }

      96% {
        opacity: 0.04;
      }

      98% {
        opacity: 0.12;
      }

      100% {
        opacity: 0;
      }
    }


    /*
      FADE-IN

      Smooth 1-second return to full visibility.
    */

    .container.fade-in {
      pointer-events: none;
      animation: fade-in 1s ease forwards;
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

  </style>
</head>

<body>

  <main class="container" id="sign">

    <img
      src="logo.png"
      alt="GANS logo"
      class="logo"
      id="logo"
    >

    <div class="name">
      gans<span class="dot">.</span>studio
    </div>

  </main>


  <script>
    const sign = document.getElementById("sign");
    const logo = document.getElementById("logo");

    let animationRunning = false;


    /*
      CLICK SEQUENCE

      0–3 seconds:
      Gradual fade-out with flickering near the end.

      3–6 seconds:
      Completely invisible.

      6–7 seconds:
      Smooth fade-in.
    */

    logo.addEventListener("click", function () {

      if (animationRunning) return;

      animationRunning = true;

      // Begin 3-second fade-out + flicker
      sign.classList.add("fade-out");


      // After 3 seconds:
      // sign is completely invisible
      setTimeout(function () {

        sign.classList.remove("fade-out");
        sign.style.opacity = "0";

      }, 3000);


      // After 6 seconds:
      // begin 1-second fade-in
      setTimeout(function () {

        sign.classList.add("fade-in");

      }, 6000);


      // After 7 seconds:
      // reset everything
      setTimeout(function () {

        sign.classList.remove("fade-in");
        sign.style.opacity = "1";

        animationRunning = false;

      }, 7000);

    });


    /*
      MOUSE OUT

      103% while hovering
          ↓
      98% briefly
          ↓
      100% normal size
    */

    logo.addEventListener("mouseleave", function () {

      if (animationRunning) return;

      logo.classList.remove("mouse-out");

      // Force browser to restart animation
      void logo.offsetWidth;

      logo.classList.add("mouse-out");

      setTimeout(function () {
        logo.classList.remove("mouse-out");
      }, 350);

    });

  </script>

</body>
</html>
